# fly.toml app configuration file generated for life-quest on 2026-05-23T12:27:53Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'life-quest'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  PORT = '3000'

[[mounts]]
  source = 'lifequest_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
